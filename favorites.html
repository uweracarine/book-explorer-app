<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Your saved favourite books."/>
  <title>Book Explorer – Favorites</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>

  <!-- ── TOAST CONTAINER ─────────────────────────────────────────────────── -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- ── NAVBAR ──────────────────────────────────────────────────────────── -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="navbar-inner">

      <a href="index.html" class="logo" aria-label="Book Explorer home">
        📚 Book Explorer
      </a>

      <div class="nav-links" role="menubar">
        <a href="index.html"     class="nav-link"        role="menuitem">Home</a>
        <a href="favorites.html" class="nav-link active" role="menuitem">Favorites</a>
        <a href="about.html"     class="nav-link"        role="menuitem">About</a>
      </div>

      <div class="nav-right">
        <button class="theme-btn" id="theme-btn" aria-label="Toggle dark mode">🌙</button>
        <button class="hamburger" id="menu-btn"  aria-label="Open menu" aria-expanded="false">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                  d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>

    </div>
  </nav>

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobile-menu" role="menu">
    <a href="index.html"     class="nav-link"        role="menuitem">Home</a>
    <a href="favorites.html" class="nav-link active" role="menuitem">Favorites</a>
    <a href="about.html"     class="nav-link"        role="menuitem">About</a>
  </div>

  <!-- ── PAGE HEADER ─────────────────────────────────────────────────────── -->
  <div class="page-header">
    <h1>My <span>Favourites</span></h1>
    <p>Books you've saved — all in one place</p>
  </div>

  <!-- ── SECTION HEADER ──────────────────────────────────────────────────── -->
  <div class="section-header">
    <h2>❤️ Saved Books</h2>
    <div class="divider"></div>
    <span class="result-count" id="fav-count"></span>
  </div>

  <!-- ── FAVORITES GRID ──────────────────────────────────────────────────── -->
  <main id="fav-grid" class="book-grid" aria-live="polite" aria-label="Favourite books"></main>

  <!-- ── FOOTER ──────────────────────────────────────────────────────────── -->
  <footer>
    <p>
      © 2026 Book Explorer &nbsp;·&nbsp;
      Data from <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a>
      &nbsp;·&nbsp;
      <a href="about.html">About</a>
    </p>
  </footer>

  <script type="module">
    import { getFavorites }                          from './js/favorites.js';
    import { renderEmpty, createFavCard, showToast } from './js/ui.js';

    // ── Theme ──────────────────────────────────────────────────────────────
    const themeBtn = document.getElementById('theme-btn');
    const THEME_KEY = 'be_theme';

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem(THEME_KEY, theme);
      themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    applyTheme(localStorage.getItem(THEME_KEY) || 'light');
    themeBtn.addEventListener('click', () => {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    // ── Mobile menu ────────────────────────────────────────────────────────
    const menuBtn    = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    menuBtn.addEventListener('click', () => mobileMenu.classList.toggle('open'));

    // ── Render favourites ──────────────────────────────────────────────────
    const grid     = document.getElementById('fav-grid');
    const favCount = document.getElementById('fav-count');

    function renderFavorites() {
      const favs = getFavorites();
      grid.innerHTML = '';
      favCount.textContent = favs.length
        ? `${favs.length} book${favs.length !== 1 ? 's' : ''}`
        : '';

      if (favs.length === 0) {
        renderEmpty(
          grid,
          '📭',
          'No favourites yet',
          'Head to the homepage, search for books you love, and hit "Add to Favourites".',
          `<a href="index.html" class="btn-primary" style="margin-top:0.5rem;display:inline-flex;gap:0.4rem;padding:0.7rem 1.4rem;border-radius:10px;font-size:0.9rem;">
             Browse Books
           </a>`
        );
        return;
      }

      favs.forEach(book => grid.appendChild(createFavCard(book, renderFavorites)));
    }

    renderFavorites();
  </script>
</body>
</html>
